<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- JURUS ANTI CACHE: Memaksa browser tidak menyimpan file lama -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>🚀 FB PRO AI STUDIO V5.2</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: { fontFamily: { poppins: ['Poppins', 'sans-serif'] }, colors: { darkbg: '#0f172a' } }
            }
        }
    </script>
</head>
<body class="bg-darkbg text-white font-poppins overflow-x-hidden">

    <!-- SPLASH SCREEN -->
    <div id="loadingScreen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-slate-950 transition-opacity duration-500">
        <div class="text-6xl mb-6 animate-bounce">🚀</div>
        <h1 class="text-3xl font-extrabold tracking-wide text-center">FB PRO AI STUDIO</h1>
        <p class="text-xl font-semibold text-yellow-400 mt-2">V5.2 Anti-Cache</p>
        <p class="mt-4 text-slate-300">Powered by</p>
        <h2 class="text-lg font-bold text-blue-400">NPA Smart System VVIP</h2>
        <div class="mt-8 w-56 h-2 rounded-full bg-slate-700 overflow-hidden">
            <div class="h-full w-full bg-gradient-to-r from-blue-500 via-cyan-400 to-yellow-400 animate-pulse"></div>
        </div>
    </div>

    <!-- MAIN WRAPPER -->
    <div class="flex min-h-screen">

        <!-- SIDEBAR -->
        <aside class="hidden lg:flex flex-col w-72 bg-slate-900 border-r border-slate-800 shadow-2xl">
            <div class="p-6 border-b border-slate-800">
                <div class="flex items-center gap-3">
                    <div class="w-14 h-14 rounded-2xl bg-blue-600 flex items-center justify-center text-3xl shadow-lg shadow-blue-500/30">🚀</div>
                    <div>
                        <h1 class="text-lg font-extrabold">AI STUDIO</h1>
                        <p class="text-xs text-yellow-400">V5.2 Ultimate</p>
                    </div>
                </div>
            </div>
        </aside>

        <!-- CONTENT WRAPPER -->
        <main class="flex-1">
            
            <header class="sticky top-0 z-30 bg-slate-900/80 backdrop-blur-lg border-b border-slate-800">
                <div class="flex items-center justify-between px-6 py-4">
                    <div class="flex items-center gap-4">
                        <div>
                            <h1 class="text-2xl font-extrabold text-blue-400">Dashboard V5.2</h1>
                        </div>
                    </div>
                </div>
            </header>

            <section class="p-6">
                <div class="grid lg:grid-cols-12 gap-6">
                    
                    <!-- LEFT PANEL: UPLOAD -->
                    <div class="lg:col-span-5 rounded-3xl bg-slate-900 border border-slate-800 p-6 shadow-xl relative">
                        <h2 class="text-2xl font-bold mb-2">📸 Upload Photo</h2>
                        <div class="border-2 border-dashed border-slate-700 rounded-2xl p-4 text-center bg-slate-800/50">
                            <img id="previewImage" src="https://placehold.co/600x400/1e293b/FFFFFF?text=PREVIEW+GAMBAR" class="w-full h-48 object-cover rounded-xl shadow-lg mb-4">
                            <!-- PERBAIKAN: Fungsi Onchange Langsung -->
                            <input id="photoUpload" type="file" accept="image/*" class="hidden" onchange="previewFoto(event)">
                            <label for="photoUpload" class="block w-full bg-blue-600 hover:bg-blue-500 rounded-xl py-3 font-bold shadow-lg shadow-blue-500/30 cursor-pointer">
                                📁 Pilih Foto
                            </label>
                        </div>
                    </div>

                    <!-- RIGHT PANEL: SETTINGS -->
                    <div class="lg:col-span-7 rounded-3xl bg-slate-900 border border-slate-800 p-6 shadow-xl relative">
                        <h2 class="text-2xl font-bold mb-6">⚙️ Mesin Pengaturan</h2>
                        <div class="space-y-4">
                            
                            <div>
                                <label class="text-sm font-bold text-yellow-400">🔑 API Key Gemini</label>
                                <input type="password" id="apiKey" placeholder="Paste API Key Ndan di sini..." class="w-full rounded-xl bg-slate-800 p-3 mt-1 outline-none border border-slate-700">
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label class="text-sm font-bold text-cyan-400 block mb-2">📦 Produk / Bisnis</label>
                                    <select id="product" onchange="toggleCustomInput()" class="w-full rounded-xl bg-slate-800 p-3 border border-slate-700">
                                        <option value="3iReborn">🛡️ 3iReborn</option>
                                        <option value="Istikmal Syariah">🕌 Istikmal Syariah</option>
                                        <option value="NPA">🤖 NPA</option>
                                        <option value="Produk Herbal & Kesehatan">🌿 Produk Herbal & Kesehatan</option>
                                        <option value="Custom">✍️ Custom (Ketik Sendiri)</option>
                                    </select>
                                    <input type="text" id="customProduct" placeholder="Ketik nama bisnis..." class="w-full mt-3 rounded-xl bg-slate-800 p-3 border border-amber-500 hidden">
                                </div>
                                <div>
                                    <label class="text-sm font-bold text-emerald-400 block mb-2">🎭 Gaya Copywriting</label>
                                    <select id="style" class="w-full rounded-xl bg-slate-800 p-3 border border-slate-700">
                                        <option value="FOMO (Fear Of Missing Out)">🔥 FOMO (Nedesak)</option>
                                        <option value="Sarkas dan menohok">😏 Sarkas (Nyindir)</option>
                                        <option value="Edukasi, memberikan tips praktis">💡 Edukasi</option>
                                    </select>
                                </div>
                            </div>

                            <div class="pt-4">
                                <!-- PERBAIKAN: Fungsi Onclick Langsung -->
                                <button onclick="prosesGenerate()" id="btnGenerateAll" class="w-full px-8 py-4 rounded-xl bg-gradient-to-r from-blue-600 via-cyan-500 to-sky-500 hover:scale-[1.02] transition-all font-bold text-lg shadow-[0_0_20px_rgba(6,182,212,0.4)]">
                                    🚀 GENERATE KONTEN SEKARANG
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- OUTPUT CENTER -->
            <section id="outputSection" class="px-6 pb-10">
                <div class="rounded-3xl bg-slate-900 border border-slate-800 p-6 shadow-xl">
                    <h2 class="text-2xl font-bold mb-6 border-b border-slate-800 pb-4">✨ Hasil AI Generator</h2>
                    
                    <div class="grid lg:grid-cols-2 gap-6">
                        <div class="bg-slate-800/50 border border-slate-700 p-5 rounded-2xl">
                            <div class="flex justify-between items-center mb-3">
                                <h2 class="font-bold text-yellow-400">🎨 Prompt Thumbnail 3D</h2>
                                <button onclick="copyTeks('outputPrompt')" class="bg-slate-700 px-3 py-1.5 rounded-lg text-xs">Copy</button>
                            </div>
                            <textarea id="outputPrompt" rows="6" class="w-full bg-slate-900 rounded-xl p-4 text-sm text-emerald-300 outline-none resize-none"></textarea>
                        </div>

                        <div class="bg-slate-800/50 border border-slate-700 p-5 rounded-2xl">
                            <div class="flex justify-between items-center mb-3">
                                <h2 class="font-bold text-blue-400">📝 Caption Facebook Pro</h2>
                                <button onclick="copyTeks('outputCaption')" class="bg-slate-700 px-3 py-1.5 rounded-lg text-xs">Copy</button>
                            </div>
                            <textarea id="outputCaption" rows="6" class="w-full bg-slate-900 rounded-xl p-4 text-sm text-slate-200 outline-none resize-none"></textarea>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- AI LOADING MODAL -->
    <div id="aiLoading" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden items-center justify-center z-50 transition-all">
        <div class="bg-slate-900 rounded-3xl border border-slate-700 p-10 w-[360px] text-center shadow-[0_0_50px_rgba(6,182,212,0.2)]">
            <div class="text-6xl animate-spin mb-6">⚙️</div>
            <h2 class="text-2xl font-bold">Mesin AI Meracik...</h2>
            <div class="mt-8 h-3 rounded-full bg-slate-800 overflow-hidden relative">
                <div class="absolute top-0 left-0 h-full w-full bg-gradient-to-r from-blue-500 via-cyan-400 to-yellow-400 animate-pulse"></div>
            </div>
        </div>
    </div>

    <script>
        let globalBase64Image = "";

        window.onload = function () {
            setTimeout(function () {
                const splash = document.getElementById("loadingScreen");
                if(splash) {
                    splash.style.opacity = '0';
                    setTimeout(() => splash.style.display = "none", 500);
                }
            }, 1000);

            const savedKey = localStorage.getItem("fbpro_api_key");
            if (savedKey) document.getElementById("apiKey").value = savedKey;
        };

        function toggleCustomInput() {
            const productSelect = document.getElementById('product').value;
            const customInput = document.getElementById('customProduct');
            if (productSelect === 'Custom') customInput.classList.remove('hidden');
            else customInput.classList.add('hidden');
        }

        function previewFoto(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('previewImage').src = e.target.result;
                globalBase64Image = e.target.result.split(',')[1];
            };
            reader.readAsDataURL(file);
        }

        function copyTeks(id) { 
            const textToCopy = document.getElementById(id);
            textToCopy.select(); 
            document.execCommand('copy'); 
            alert("Berhasil disalin ke memori HP, Komandan! 🫡"); 
        }

        async function prosesGenerate() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const style = document.getElementById('style').value;
            
            let product = document.getElementById('product').value;
            if (product === 'Custom') {
                product = document.getElementById('customProduct').value.trim();
                if (!product) return alert("Komandan, ketik dulu nama produk custom-nya! 🫡");
            }
            
            if (!apiKey || !globalBase64Image) {
                return alert("Tunggu Ndan! Pastikan API Key diisi dan Foto SUDAH DIPILIH! 🫡");
            }

            localStorage.setItem("fbpro_api_key", apiKey);

            const btn = document.getElementById('btnGenerateAll');
            const originalBtnText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `Proses Meracik...`;

            const loadingModal = document.getElementById('aiLoading');
            loadingModal.classList.remove('hidden');
            loadingModal.classList.add('flex');

            const promptText = `Anda adalah Ahli Copywriting FB Pro. Analisa gambar yang dilampirkan, buatkan konten untuk produk [${product}]. Gaya: [${style}]. BALAS JSON VALID: {"prompt": "1 paragraf prompt gambar yg pakai angle dramatis (Shoot Angle), dimensi (Background & Foreground), Efek Lensa. Wajib tambah instruksi teks overlay 3 kata (Hook-Masalah-Solusi) Style Typography 3D Bold Gradient warna Putih-Kuning-Merah. Akhiri: 'Gunakan aspek rasio 1:1'.", "caption": "Caption FB gaya ${style}. JANGAN mendongeng. SINGKAT padat nendang."}`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        contents: [{ parts: [{ text: promptText }, { inline_data: { mime_type: "image/jpeg", data: globalBase64Image } }] }],
                        generationConfig: { response_mime_type: "application/json" }
                    })
                });

                const data = await response.json();
                
                if (data.error) throw new Error(data.error.message);
                if (!data.candidates || data.candidates.length === 0) throw new Error("Diblokir Filter Keamanan!");

                let rawText = data.candidates[0].content.parts[0].text.replace(/\`\`\`json/g, '').replace(/\`\`\`/g, '').trim();
                const resultJSON = JSON.parse(rawText);

                document.getElementById('outputPrompt').value = resultJSON.prompt;
                document.getElementById('outputCaption').value = resultJSON.caption;
                
            } catch (e) { 
                alert("Error Ndan: " + e.message); 
            } finally { 
                loadingModal.classList.remove('flex');
                loadingModal.classList.add('hidden');
                
                btn.disabled = false;
                btn.innerHTML = originalBtnText;

                document.getElementById("outputSection").scrollIntoView({ behavior: 'smooth' });
            }
        }
    </script>
</body>
</html>
