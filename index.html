<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FB PRO AI STUDIO V3.5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .bg-gold { background: linear-gradient(to right, #d97706, #f59e0b, #fbbf24); }
        .text-gold { color: #fbbf24; }
        .glass { background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); }
        .loader { border: 4px solid #334155; border-top: 4px solid #fbbf24; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen p-4 flex justify-center items-start">
    <div class="max-w-4xl w-full space-y-6">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-black text-white uppercase tracking-wide">FB PRO <span class="text-gold">AI STUDIO</span></h1>
            <p class="text-slate-400 text-sm">V3.5: Judul Menghipnotis & Auto Rasio 1:1</p>
        </div>

        <div class="glass p-6 rounded-2xl shadow-xl space-y-6">
            <div>
                <label class="block text-sm font-bold text-gold mb-2">🔑 API Key</label>
                <input type="password" id="apiKey" placeholder="Paste API Key..." class="w-full bg-slate-800 border border-slate-600 rounded-lg px-4 py-3 text-white">
            </div>
            <div>
                <label class="block text-sm font-bold text-gold mb-2">📸 Upload Foto</label>
                <input type="file" id="imageInput" accept="image/*" class="w-full text-slate-300">
                <div class="mt-4 hidden" id="previewContainer"><img id="imagePreview" class="max-h-48 rounded-xl mx-auto" src="" alt="Preview"></div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-bold text-slate-300 mb-2">🎭 Gaya Bahasa</label>
                    <select id="style" class="w-full bg-slate-800 border border-slate-600 rounded-lg px-4 py-3 text-white">
                        <option value="FOMO (Fear Of Missing Out), menakut-nakuti agar merasa rugi">🔥 FOMO</option>
                        <option value="Pro Kontra, memancing perdebatan agar viral">⚔️ Pro Kontra</option>
                        <option value="Sarkas dan menohok, menyindir halus">😏 Sarkas</option>
                        <option value="Storytelling, kisah emosional">📖 Storytelling</option>
                        <option value="Motivasi, membakar semangat">🔥 Motivasi</option>
                        <option value="Edukasi, memberikan tips praktis">💡 Edukasi</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-300 mb-2">📦 Produk / Bisnis</label>
                    <select id="product" class="w-full bg-slate-800 border border-slate-600 rounded-lg px-4 py-3 text-white">
                        <option value="3iReborn">🛡️ 3iReborn</option>
                        <option value="Istikmal Syariah">🕌 Istikmal Syariah</option>
                        <option value="NPA">🤖 NPA</option>
                        <option value="Affiliate Digital">💻 Affiliate Digital</option>
                        <option value="UMKM & Kuliner">🍱 UMKM & Kuliner</option>
                        <option value="Produk Herbal & Kesehatan">🌿 Produk Herbal & Kesehatan</option>
                    </select>
                </div>
            </div>
            <button id="generateBtn" class="w-full bg-gold text-slate-900 font-black py-4 rounded-xl">
                <span id="btnText">🚀 GENERATE KONTEN</span>
                <div class="loader" id="loader"></div>
            </button>
        </div>

        <div id="outputSection" class="glass p-6 rounded-2xl shadow-xl space-y-6 hidden">
            <!-- Grid Judul dan Prompt -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="space-y-2">
                    <label class="text-xs font-bold text-slate-400 uppercase">Judul Menghipnotis</label>
                    <textarea id="outJudul" readonly class="w-full bg-slate-800 border border-slate-600 rounded-lg p-3 text-sm h-32 resize-none"></textarea>
                    <button onclick="copyTeks('outJudul')" class="w-full bg-slate-700 hover:bg-slate-600 text-white py-2 rounded font-bold transition">📋 Copy Judul</button>
                </div>
                <div class="space-y-2">
                    <label class="text-xs font-bold text-slate-400 uppercase">Prompt Gambar (Auto 1:1 + 3 Kata Overlay)</label>
                    <textarea id="outPrompt" readonly class="w-full bg-slate-800 border border-slate-600 rounded-lg p-3 text-sm h-32 resize-none"></textarea>
                    <button onclick="copyTeks('outPrompt')" class="w-full bg-slate-700 hover:bg-slate-600 text-white py-2 rounded font-bold transition">📋 Copy Prompt</button>
                </div>
            </div>

            <!-- Caption -->
            <div class="space-y-2">
                <label class="text-xs font-bold text-slate-400 uppercase">Caption Facebook Pro</label>
                <textarea id="outCaption" readonly class="w-full bg-slate-800 border border-slate-600 rounded-lg p-3 text-sm h-48 resize-none"></textarea>
                <button onclick="copyTeks('outCaption')" class="w-full bg-slate-700 hover:bg-slate-600 text-white py-2 rounded font-bold transition">📋 Copy Caption</button>
            </div>

            <!-- Grid CTA dan Hashtag -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="space-y-2">
                    <label class="text-xs font-bold text-slate-400 uppercase">Call To Action (CTA)</label>
                    <textarea id="outCTA" readonly class="w-full bg-slate-800 border border-slate-600 rounded-lg p-3 text-sm h-20 resize-none"></textarea>
                    <button onclick="copyTeks('outCTA')" class="w-full bg-slate-700 hover:bg-slate-600 text-white py-2 rounded font-bold transition">📋 Copy CTA</button>
                </div>
                <div class="space-y-2">
                    <label class="text-xs font-bold text-slate-400 uppercase">Hashtag</label>
                    <textarea id="outHashtag" readonly class="w-full bg-slate-800 border border-slate-600 rounded-lg p-3 text-sm h-20 resize-none"></textarea>
                    <button onclick="copyTeks('outHashtag')" class="w-full bg-slate-700 hover:bg-slate-600 text-white py-2 rounded font-bold transition">📋 Copy Hashtag</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let base64Image = "";
        document.getElementById('imageInput').addEventListener('change', function(e) {
            const reader = new FileReader();
            reader.onload = function(event) {
                document.getElementById('imagePreview').src = event.target.result;
                document.getElementById('previewContainer').classList.remove('hidden');
                base64Image = event.target.result.split(',')[1];
            };
            reader.readAsDataURL(e.target.files[0]);
        });

        document.getElementById('generateBtn').addEventListener('click', async function() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const style = document.getElementById('style').value;
            const product = document.getElementById('product').value;
            
            if (!apiKey || !base64Image) return alert("Komandan, Isi API Key & Upload Foto dulu! 🫡");

            const btn = document.getElementById('generateBtn');
            const loader = document.getElementById('loader');
            const btnText = document.getElementById('btnText');
            
            btn.disabled = true;
            btnText.innerText = "MERACIK V3.5...";
            loader.style.display = "block";

            const promptText = `Anda adalah Ahli Digital Marketing. Analisa gambar yang dilampirkan, buatkan konten untuk produk [${product}]. Gaya: [${style}]. 
            BALAS JSON: {
                "judul": "Buatkan 1 kalimat judul utama (Headline) yang sangat menghipnotis, memancing rasa penasaran, dan relevan dengan gambar.",
                "prompt": "Buatkan ide gambar deskriptif berdasarkan gambar ini, lalu tambahkan prompt teks overlay yang sangat CTR tinggi dengan komposisi warna Putih-Kuning-Merah. Di dalam gambar wajib ada teks overlay 3 kata (Hook-Masalah-Solusi) yaitu: [SUSUN 3 KATA DISINI BERDASARKAN GAMBAR]. Wajib tambahkan perintah di akhir: 'Gunakan aspek rasio 1:1'.", 
                "caption": "Caption panjang dengan gaya ${style} untuk promosi produk ${product}", 
                "cta": "Kalimat Call to Action", 
                "hashtag": "5-7 hashtag relevan"
            }`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: promptText }, { inline_data: { mime_type: "image/jpeg", data: base64Image } }] }] })
                });

                const data = await response.json();
                let rawText = data.candidates[0].content.parts[0].text.replace(/```json/g, '').replace(/```/g, '').trim();
                const resultJSON = JSON.parse(rawText);

                document.getElementById('outJudul').value = resultJSON.judul;
                document.getElementById('outPrompt').value = resultJSON.prompt;
                document.getElementById('outCaption').value = resultJSON.caption;
                document.getElementById('outCTA').value = resultJSON.cta;
                document.getElementById('outHashtag').value = resultJSON.hashtag;
                document.getElementById('outputSection').classList.remove('hidden');
            } catch (e) { 
                alert("Error Ndan: " + e.message); 
            } finally { 
                btn.disabled = false; 
                btnText.innerText = "🚀 GENERATE KONTEN";
                loader.style.display = "none"; 
            }
        });

        function copyTeks(id) { 
            document.getElementById(id).select(); 
            document.execCommand('copy'); 
            alert("Berhasil di-copy, Ndan! 🫡"); 
        }
    </script>
</body>
</html>
